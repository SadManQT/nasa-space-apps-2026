@keyframes lb{0%,100%{transform:scaleY(.5)}25%{transform:scaleY(.92)}50%{transform:scaleY(.3)}75%{transform:scaleY(.7)}}
@keyframes lc{0%,100%{transform:scaleY(.7)}25%{transform:scaleY(.75)}50%{transform:scaleY(.95)}75%{transform:scaleY(.35)}}
@keyframes ld{0%,100%{transform:scaleY(.6)}25%{transform:scaleY(.5)}50%{transform:scaleY(.38)}75%{transform:scaleY(.92)}}
.fl{stroke-dasharray:10 12;animation:fl 1.2s linear infinite}
@keyframes fl{to{stroke-dashoffset:-22}}
</style>
