<style>
text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.st{fill:#e8ecff;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}
.k{font-size:20px;font-weight:700;letter-spacing:5px;fill:#F2C230}

.tl{opacity:0;letter-spacing:10px;animation:trk 1.2s cubic-bezier(.16,1,.3,1) .25s forwards}
@keyframes trk{from{opacity:0;letter-spacing:34px}to{opacity:1;letter-spacing:10px}}
.earth{animation:er 12s ease-in-out infinite}@keyframes er{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes up{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
.fd{opacity:0;animation:fd .8s ease-out .1s forwards}.fd2{opacity:0;animation:fd .9s ease-out 1.6s forwards}
@keyframes fd{to{opacity:1}}
.ul{transform-box:fill-box;transform-origin:center;transform:scaleX(0);animation:ul .8s cubic-bezier(.65,0,.35,1) 1.3s forwards}
@keyframes ul{to{transform:scaleX(1)}}
.ch{opacity:0;animation:up .6s cubic-bezier(.34,1.45,.64,1) forwards}
.sun{opacity:.10;filter:blur(40px);animation:sun 9s ease-in-out infinite}
@keyframes sun{0%,100%{opacity:.06}50%{opacity:.34}}
.lt{animation:tw 3s ease-in-out infinite}
</style>
