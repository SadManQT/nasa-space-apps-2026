name: Publish verified judging candidate
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Windows and macOS judging candidate workflow run
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check package and source verification
        run: python3 production/qa/test_build_release.py
      - name: Publish the authorized judging pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: >-
          python3 production/qa/publish_candidate.py
          --run-id "$CANDIDATE_RUN_ID"
          --tag v0.1.0-judging.20261112
          --notes-file production/qa/builds/atik_20261112/release_notes.md
          --evidence production/qa/builds/atik_20261112
          --evidence production/qa/perf/atik_20261112
